name: 产品页

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同分支并发推送时只保留最新一次部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4