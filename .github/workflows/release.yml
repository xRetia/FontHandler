name: 发布

# 打 tag 即发布：v2.0.0 -> Release v2.0.0 + FontHandler-v2.0.0.exe
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布时使用的版本号，例如 v2.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建 Windows 免安装版
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $ref = '${{ github.event.inputs.tag || github.ref }}'
          $tag = $ref -replace '^refs/tags/', ''
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw "版本号格式应为 vX.Y.Z，实际为：$tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: 安装 Python 与依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 PyQt6 与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 运行测试
        run: python selftest.py

      - name: 同步版本号到源码与资源文件
        shell: pwsh
        run: |
          $n = '${{ steps.ver.outputs.number }}'
          $parts = $n.Split('.')
          # config.py lives in the package, not at the repo root.
          (Get-Content fonthandler\config.py -Raw) `
            -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$n`"" `
            | Set-Content fonthandler\config.py -Encoding UTF8
          $vi = Get-Content version_info.txt -Raw
          $vi = $vi -replace '\d+,\s*\d+,\s*\d+,\s*\d+', "$($parts[0]), $($parts[1]), $($parts[2]), 0"
          $vi = $vi -replace "'2\.0\.0'", "'$n'"
          $vi | Set-Content version_info.txt -Encoding UTF8
          python -c "from fonthandler import config; print('APP_VERSION =', config.APP_VERSION)"

      - name: 打包单文件 exe
        run: |
          python -m PyInstaller FontHandler.spec --noconfirm --clean --log-level WARN

      - name: 校验产物可启动
        shell: pwsh
        run: |
          $exe = '.\dist\FontHandler.exe'
          $expected = '${{ steps.ver.outputs.number }}'
          if (-not (Test-Path $exe)) { throw '未生成 exe' }
          "体积：$([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB"

          # 单文件模式：bootloader 父进程解包后再 fork 出真正干活的子进程，
          # 窗口在子进程里。父进程的 MainWindowTitle 永远是空的，所以要按
          # 进程名去找带窗口的那个 —— 只看 Start-Process 返回的那个必然误报。
          $launched = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $window = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            if ($launched.HasExited) {
              throw "打包后的程序启动即退出，退出码 $($launched.ExitCode)"
            }
            # 只认本次启动的进程，否则 runner 上残留的同名进程会冒充成功。
            $window = Get-Process FontHandler -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne 0 -and $_.StartTime -ge $launched.StartTime } |
              Sort-Object StartTime | Select-Object -First 1
            if ($window) { break }
          }
          if (-not $window) { throw '90 秒内没有出现主窗口' }

          $title = $window.MainWindowTitle
          "窗口进程 PID $($window.Id)，标题：$title"
          if (-not $title) { throw '找到窗口句柄但标题为空' }
          if ($title -notmatch [regex]::Escape($expected)) {
            throw "窗口标题未包含版本号 $expected"
          }

          # 打包漏掉的资源不会报错，只会让界面静默降级（例：checkbox 打勾变成
          # 一个纯色方块）。所以确认解包目录里确实带了关键资源。
          # PyInstaller 6 的子进程命令行里没有 _MEIPASS 参数，只能按修改时间
          # 找本次启动刚解包的那个 _MEI* 目录。
          $meipass = Get-ChildItem $env:TEMP -Directory -Filter '_MEI*' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $meipass) { throw '未找到 PyInstaller 解包目录，无法校验打包资源' }
          $tick = Join-Path $meipass.FullName 'fonthandler\ui\assets\check.png'
          if (-not (Test-Path $tick)) { throw "打包产物缺少 $tick，QSS 图片会静默失效" }
          "资源校验通过：$tick"

          Stop-Process -Name FontHandler -Force -ErrorAction SilentlyContinue
          "打包产物校验通过"

      - name: 计算校验和
        shell: pwsh
        run: |
          $n = '${{ steps.ver.outputs.number }}'
          $hash = (Get-FileHash '.\dist\FontHandler.exe' -Algorithm SHA256).Hash
          "FontHandler-v$n.exe  SHA256  $hash" | Out-File -FilePath 'dist\SHA256SUMS.txt' -Encoding UTF8
          Get-Content 'dist\SHA256SUMS.txt'

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 原生命令返回非 0 时不要抛，由下面显式检查退出码，避免 gh 往
          # stderr 写一行就被 $ErrorActionPreference='Stop' 中断。
          $ErrorActionPreference = 'Continue'
          $tag = '${{ steps.ver.outputs.tag }}'
          $n = '${{ steps.ver.outputs.number }}'
          $notes = @"
          ## FontHandler $n

          让 Windows 字体看着更舒畅。基于 GaspHack 技术，通过优化字体渲染参数让文字显示更清晰，无需安装，下载即用。

          ### 下载后怎么用

          1. 下载 `FontHandler-v$n.exe`，双击运行
          2. 点状态栏的「以管理员身份重启」授权（修改系统字体必须管理员权限）
          3. 在 GaspHack 页面生成补丁字体，然后到「替换字体」页面一键替换
          4. 如果有文件被占用，重启后自动生效

          ### 系统要求

          - Windows 7 SP1 及以上（推荐 Windows 10 1709+ / Windows 11）
          - 旧系统会弹出风险提示，确认后仍可使用，但效果可能有限
          - 需要管理员权限才能修改系统字体

          ### 这个版本有什么新东西

          - 全新产品主页，带壁纸背景和特性展示
          - 排除 emoji 字体文件，避免影响表情符号显示
          - 放宽系统版本门槛：Win7 SP1 即可运行（带风险提示），推荐 Win10 1709+
          - 应用图标更新

          ### 安全校验

          \`SHA256SUMS.txt\` 提供本次下载文件的 SHA256 校验值，可用来验证文件完整性。

          ### 遇到问题？

          替换后如果登录界面字体异常，正常登录后打开 FontHandler，在弹出的提示里点「从备份还原」即可恢复。完整说明见 [产品主页](${{ github.server_url }}/${{ github.repository }}) 和 README。
          "@

          foreach ($f in 'dist\FontHandler.exe', 'dist\SHA256SUMS.txt') {
            if (-not (Test-Path $f)) { throw "缺少待上传文件：$f" }
          }

          # gh 的 <路径>#<显示名> 语法，必须在变量里拼好再传参。
          # 写成 'a' + $n + '.exe' 是错的：PowerShell 参数模式不解析 +，
          # 会把 +、2.0.2、.exe 当成三个多余的上传文件参数。
          $asset = "dist\FontHandler.exe#FontHandler-v${n}.exe"

          # 允许重跑：上一次运行可能已经建出同名 release，直接 create 会报
          # already exists。删掉它（不加 --cleanup-tag，tag 要留着给
          # --verify-tag 用）。
          gh release delete $tag --yes 2>$null

          gh release create $tag $asset 'dist\SHA256SUMS.txt' `
            --title "FontHandler $n" `
            --notes $notes `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create 失败，退出码 $LASTEXITCODE" }
          "已创建 Release $tag"

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build/
            dist/
          retention-days: 7